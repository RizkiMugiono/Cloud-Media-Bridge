name: Offline Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust offline safety and MCP contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      CARGO_TERM_COLOR: always
      CMB_LIVE_GPU_TESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Verify dependency lockfile
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Compile and run local tests (no cloud accounts)
        run: cargo test --locked --workspace --all-targets
      - name: Build standalone Rust binary for cross-language worker tests
        run: cargo build --locked --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python media worker HTTP/security tests (fixture only, no GPU)
        run: python -m unittest discover -s workers/tests -v
      - name: Dockerized CPU-only media fixture worker round trip
        if: runner.os == 'Linux'
        run: |
          docker build -f workers/Dockerfile.fixture -t cmb-offline-fixture:ci .
          container=$(docker run -d --rm --network none \
            -e CMB_WORKER_TOKEN=ci-fixture-token-not-for-production \
            -e CMB_MODEL_ID=fixture/offline-model \
            -e CMB_MODEL_SHA=0000000000000000000000000000000000000000 \
            -e CMB_TASK=text-to-image \
            -e CMB_RUNTIME_FAMILY=diffusers \
            -e CMB_ENABLE_TEST_FIXTURE=1 \
            cmb-offline-fixture:ci)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker exec -i "$container" python - <<'PY'
          import hashlib, json, time, urllib.request
          base="http://127.0.0.1:8000"
          for attempt in range(25):
              try:
                  with urllib.request.urlopen(base+"/health",timeout=2) as response:
                      assert json.load(response)["simulation_only"] is True
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise AssertionError("CPU fixture Docker worker did not become healthy")
          body=json.dumps({
              "schema_version":1,
              "request_id":"docker-ci-001",
              "task":"text-to-image",
              "model":{"id":"fixture/offline-model",
                       "revision_sha":"0000000000000000000000000000000000000000"},
              "inputs":[],
              "fixture_kind":"image"
          }).encode()
          headers={"Authorization":"Bearer ci-fixture-token-not-for-production",
                   "Content-Type":"application/json"}
          request=urllib.request.Request(base+"/v1/media/generate",data=body,headers=headers)
          with urllib.request.urlopen(request,timeout=5) as response:
              result=json.load(response)
          assert result["simulation_only"] is True
          artifact=result["artifacts"][0]
          request=urllib.request.Request(
              base+"/v1/media/artifacts/"+artifact["asset_ref"],
              headers={"Authorization":"Bearer ci-fixture-token-not-for-production"})
          with urllib.request.urlopen(request,timeout=5) as response:
              data=response.read()
          assert hashlib.sha256(data).hexdigest()==artifact["sha256"]
          assert data.startswith(b"<svg")
          print("Docker CPU-only fixture generated and checksum-verified artifact")
          PY
      - name: Build digest-pinned candidate image on CPU with offline wheel install
        if: runner.os == 'Linux'
        run: |
          docker pull python:3.12-slim
          base=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')
          context=$(mktemp -d)
          trap 'rm -rf "$context"' EXIT
          python workers/tests/build_smoke_bundle.py "$context" "$base"
          target/debug/cloud-media-bridge runtimes bundle-verify "$context"
          docker build --network none --build-arg BASE_IMAGE="$base" -t cmb-smoke-ci:local "$context"
          docker run --rm --network none --entrypoint python cmb-smoke-ci:local -I -c 'import os, cmb_smoke_probe; assert cmb_smoke_probe.CI_ONLY; assert os.getuid() == 10001; assert os.access(os.environ["HF_HOME"], os.W_OK)'
          if docker run --rm --network none cmb-smoke-ci:local; then
            echo "Unexpected default worker startup"
            exit 1
          fi
          echo "CPU-only candidate image built; pinned wheel installed without network; default worker refused"
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check provider catalog syntax and required entries
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          with open("config/providers.json", encoding="utf-8") as f:
              data = json.load(f)
          ids = [p["id"] for p in data["providers"]]
          assert len(ids) == len(set(ids)), "Duplicate provider ids"
          assert {"modal", "runpod-serverless", "runpod-pods", "vast-serverless",
                  "vast-instances", "lambda-cloud", "generic-https",
                  "generic-ssh", "kubernetes-gpu"}.issubset(ids)
          for provider in data["providers"]:
              assert provider["integration"] in {"read_only", "planned"}
              assert provider["capabilities"]["execute"] is False
          print(f"Verified {len(ids)} non-secret provider definitions")
          PY
      - name: Validate user-approved deployment policy (no cloud access)
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          with open("config/deployment-policy.json", encoding="utf-8") as f:
              policy = json.load(f)
          with open("config/providers.json", encoding="utf-8") as f:
              providers = json.load(f)["providers"]
          runtime = policy["runtime_installation"]
          assert set(runtime["allowed_routes"]) == {
              "verified_prebuilt_oci_image",
              "vetted_runtime_recipe_on_base_image",
          }
          assert runtime["selection"] == "compatibility_first"
          assert runtime["untrusted_model_repository_scripts"] == "never_execute_automatically"
          assert policy["provider_development"]["strategy"] == "parallel_workstreams"
          ids = {p["id"] for p in providers}
          assert set(policy["provider_development"]["targets"]) == ids
          assert all(p["development_track"] == "parallel" for p in providers)
          assert all(p["lifecycle_implementation"] == "not_implemented" for p in providers)
          assert all(p["capabilities"]["execute"] is False for p in providers)
          approval = policy["approval"]
          assert approval["deployment"] == "new_human_approval_for_every_deployment_request"
          assert approval["grants_reusable_for_deployment"] is False
          assert approval["agent_or_mcp_may_self_approve"] is False
          stop = policy["resource_lifecycle"]["pod_vm_instance"]
          assert stop["after_last_job"] == "explicit_user_selected_policy_required"
          assert policy["resource_lifecycle"]["choices"]["selection"] == "required_no_implicit_default"
          assert stop["ownership_proof_required"] is True
          assert stop["no_other_active_jobs_required"] is True
          assert stop["auto_destroy"] is False
          assert stop["auto_terminate"] is False
          assert stop["stop_unsupported"] == "report_action_required_and_never_claim_stopped"
          assert policy["implementation_status"] == "documented_contract_not_enforced"
          assert policy["execution"]["current_capability"] == "read_only"
          print("All four deployment decisions validated as non-executable contracts")
          PY
      - name: Validate all-media discovery catalog (no provider or GPU access)
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          with open("config/media-tasks.json", encoding="utf-8") as f:
              catalog = json.load(f)
          expected = {"image","video","audio","speech","music","three_d","spatial","document","multimodal"}
          assert set(catalog["categories"]) == expected
          tasks = catalog["tasks"]
          assert len(tasks) >= 60
          names = [task["task"] for task in tasks]
          assert len(names) == len(set(names)), "Duplicate media task tags"
          assert all(set(task["categories"]).issubset(expected) for task in tasks)
          for label in ("image-text-to-video","video-to-video","audio-to-audio",
                        "text-to-speech","automatic-speech-recognition",
                        "text-to-music","image-to-3d","document-question-answering",
                        "pose-estimation","any-to-any"):
              assert label in names, f"Missing media task: {label}"
          assert "text-generation" in catalog["non_media_pipeline_tags"]
          assert catalog["implementation_status"] == "classification_only_no_gpu_runtime"
          assert catalog["classification_rules"]["no_arbitrary_remote_code"] is True
          assert catalog["classification_rules"]["unknown_task"].startswith("preserve_model")
          for path in ("schemas/media-request.schema.json","schemas/media-result.schema.json",
                       "schemas/worker-request.schema.json","schemas/worker-result.schema.json"):
              with open(path, encoding="utf-8") as stream:
                  schema=json.load(stream)
              assert schema["$schema"].endswith("2020-12/schema")
              assert schema["properties"]["schema_version"]["const"] == 1
          print(f"Validated {len(tasks)} task hints across {len(expected)} media families and all four media schemas")
          PY
      - name: Validate runtime registry fail-closed contracts (no GPU)
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          runtime=json.loads(Path("config/runtime-registry.json").read_text())
          policy=json.loads(Path("config/deployment-policy.json").read_text())
          routes=set(policy["runtime_installation"]["allowed_routes"])
          assert runtime["schema_version"] == 1
          assert runtime["implementation_status"] == "read_only_candidates_no_deployment"
          entries=runtime["entries"]
          assert len(entries) >= 18
          assert len({e["id"] for e in entries}) == len(entries)
          assert {e["delivery_route"] for e in entries} == routes
          assert {"diffusers","transformers","comfyui","audiocraft","pyannote","speechbrain","specialized"} <= {e["family"] for e in entries}
          for e in entries:
              assert e["upstream_url"].startswith("https://")
              assert e["verification"]["status"] == "candidate_unverified"
              assert not e["verification"]["model_tested"]
              assert not e["verification"]["provider_tested"]
              assert not e["execution_enabled"]
              assert e["delivery"]["oci_image_digest"] is None
              assert e["delivery"]["pinned_install_manifest"] is None
              assert e["delivery"]["worker_implementation_digest"] is None
              assert e["network_policy"] == "no_inbound_network_until_authenticated_worker_is_verified"
          assert not runtime["runtime_registry_policy"]["cloud_execution_implemented"]
          assert runtime["runtime_registry_policy"]["require_new_human_approval_per_deployment"]
          print(f"Validated {len(entries)} non-executable runtime routes across all upstream families")
          PY
      - name: Check billing increments independent of lifecycle (offline)
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          policy = json.loads(Path("config/billing-policy.json").read_text())
          providers = json.loads(Path("config/providers.json").read_text())["providers"]
          assert policy["schema_version"] == 1
          life = policy["default_lifecycle"]
          assert life["after_final_job"] == "explicit_user_selected_policy_required"
          assert life["wait_until_end_of_paid_period"] is False
          assert life["idle_reuse_requires_new_explicit_permission"] is True
          assert life["no_destructive_fallback_without_separate_approval"] is True
          assert len(providers) == 9
          assert all(item["billing"]["live_quote_required_before_deployment"] for item in providers)
          assert all(item["billing"]["actual_minimum_and_increment_must_be_confirmed"] for item in providers)
          def estimate(name):
              path = "examples/billing-" + name + ".example.json"
              cmd = ["cargo", "run", "--quiet", "--locked", "--", "billing", "estimate", path]
              p = subprocess.run(cmd, text=True, capture_output=True, check=True, timeout=60)
              return json.loads(p.stdout)
          second = estimate("per-second-5s")
          hour = estimate("hour-minimum-5s")
          prepaid = estimate("prepaid-monthly")
          assert second["effective_billable_ms"] == 5000
          assert second["estimated_incremental_compute_micro_usd"] == 1389
          assert hour["effective_billable_ms"] == 3600000
          assert hour["estimated_incremental_compute_micro_usd"] == 1000000
          assert prepaid["estimate_status"] == "not_estimable_from_job_duration"
          assert all(v["lifecycle_decision"] == "not_selected_by_billing" and v["requires_user_lifecycle_selection"]
                     for v in [second,hour,prepaid])
          print("Validated per-second/per-hour/prepaid billing contracts without selecting lifecycle")
          PY
